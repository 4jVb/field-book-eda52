name: Build debug APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Aceptar licencias del SDK de Android (ya viene instalado)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: echo "NIX_LICENSE=" > local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultado
          path: |
            app/build/outputs/apk/debug/*.apk
            build.log
